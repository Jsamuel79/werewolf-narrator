include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Generated Drift code is excluded from analysis, so a missing part file
    # before `build_runner` runs must stay an error, not a warning.
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_parenthesis
    - directives_ordering
    - sort_child_properties_last
